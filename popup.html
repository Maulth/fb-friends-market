<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>FB Friends &amp; Market</h1>
    <p>On = hidden. Changes apply instantly.</p>
  </header>

  <label class="row">
    <span class="text">
      <span class="name">Facebook Social Feed</span>
      <span class="desc">Hide the feed &amp; send home to Marketplace</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="hideFbFeed">
      <span class="slider"></span>
    </span>
  </label>

  <label class="row">
    <span class="text">
      <span class="name">Facebook Comments</span>
      <span class="desc">Hide comments on posts (off by default)</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="hideFbComments">
      <span class="slider"></span>
    </span>
  </label>

  <script src="popup.js"></script>
</body>
</html>
