<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>FB Friends &amp; Market</h1>
    <p>Changes apply instantly.</p>
  </header>

  <main>
  <label class="row">
    <span class="text">
      <span class="name">Friends &amp; Market mode</span>
      <span class="desc">No ranked feed, Watch, Reels, Stories, or suggested posts</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="hideFbFeed">
      <span class="slider"></span>
    </span>
  </label>

  <div class="row" data-needs="hideFbFeed">
    <span class="text">
      <span class="name">Home page</span>
      <span class="desc">Where facebook.com opens</span>
    </span>
    <span class="segmented" role="radiogroup" aria-label="Home page">
      <label><input type="radio" name="homePage" value="friends"><span>Friends</span></label>
      <label><input type="radio" name="homePage" value="marketplace"><span>Market</span></label>
    </span>
  </div>

  <label class="row" data-needs="hideFbFeed">
    <span class="text">
      <span class="name">Strict friends</span>
      <span class="desc">Also hide friends' reshares and link posts</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="strictFriends">
      <span class="slider"></span>
    </span>
  </label>

  <label class="row">
    <span class="text">
      <span class="name">Hide comments</span>
      <span class="desc">Comment sections under every post</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="hideFbComments">
      <span class="slider"></span>
    </span>
  </label>

  <label class="row" data-needs="hideFbFeed">
    <span class="text">
      <span class="name">Debug outlines</span>
      <span class="desc">Outline what would be hidden instead of hiding it</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="debugOutline">
      <span class="slider"></span>
    </span>
  </label>
  </main>

  <footer>
    <a href="https://github.com/Maulth/fb-friends-market#readme" target="_blank" rel="noopener">Help &amp; feedback</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
